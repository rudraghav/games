[project]
name = "games-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.162.0", "uvicorn[standard]==0.54.0", "sqlalchemy==2.1.6",
  "psycopg[binary]==3.3.6", "pydantic==2.14.2", "pydantic-settings==2.16.2",
  "pyjwt[crypto]==2.15.1", "cryptography==50.0.2", "alembic==1.20.1", "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "hypothesis==6.170.14", "ruff==0.17.3", "mypy==2.4.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["tests", "alembic"]
